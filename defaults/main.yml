---
# defaults file for ansible-role-unix_users

# Groups to create: name (required), system (default false), gid (optional)
_unix_users_groups:
  - name: "{{ CENTERDEVICE.group }}"
    system: true

# Users to create or remove: name (required); for present users also comment and groups
# (supplementary groups, must exist); optional uid, password (hash, default '!' = locked),
# shell (default /bin/bash), ssh.public_key (written to ~/.ssh/authorized_keys) and
# state (present or absent, default present)
_unix_users_users:
  - name: "{{ CENTERDEVICE.user }}"
    comment: "CenterDevice User"
    groups:
      - "{{ CENTERDEVICE.group }}"
    shell: /usr/sbin/nologin
